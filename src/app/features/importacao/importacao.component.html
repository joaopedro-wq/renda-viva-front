<bd-page-header
  title="Importar extrato"
  description="Suba o CSV do seu banco em vez de lançar linha por linha. Nada é gravado até você revisar e confirmar."
/>

<div class="app-card mt-6 flex flex-col gap-6 p-5 sm:p-8">
  @if (estadoInicial(); as estado) {
    <app-form-importacao [arquivo]="arquivo()!" [estadoInicial]="estado" (voltar)="reiniciar()" />
  } @else {
    <app-upload-extrato
      [estado]="estadoEnvio()"
      [percentual]="percentual()"
      [nomeArquivo]="nomeArquivoSelecionado()"
      [erro]="erro()"
      (arquivoSelecionado)="selecionarArquivo($event)"
      (arrastandoChange)="onArrastandoChange($event)"
    />
  }
</div>
